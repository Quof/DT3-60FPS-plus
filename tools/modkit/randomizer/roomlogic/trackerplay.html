<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tracker playthroughs</title></head>
<body>
<pre id="out">running...</pre>
<script src="data.js"></script>
<script src="tracker.js"></script>
<script src="seeds.js"></script>
<script src="trackerplay.js"></script>
<script>
  // (?runs=N: each seed played N times, the doors picked at random each time; ?manual: nothing run, TP_RUN(runs, from,
  // to) called from the console a range of seeds at a time)
  if (/manual/.test(location.search)) { document.getElementById("out").textContent = TP_SEEDS.length + " seeds: TP_RUN(runs, from, to)"; }
  else {
    var m = /runs=(\d+)/.exec(location.search), res = TP_RUN(m ? +m[1] : 3);
    document.getElementById("out").textContent = JSON.stringify(res, null, 1);
  }
</script>
</body></html>
