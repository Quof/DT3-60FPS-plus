description=A new game starts in the game's endgame world (every area open, no CHAOS invasion) in Central City, able to walk and jump. Every collectible, the other movement abilities, attacks and keys are shuffled into each other's places, in layers: each ability or key is somewhere the ones before it reach, so they spread out from Central City (what each place needs is worked out from the rooms themselves). The equipment shops' stock is shuffled between the shops, and every boss is fought in its own room. Win: get the 8 instruments, beat the Abomination, then the CHAOS Warmaster at the end of the CHAOS Warship. A new game opens with the options: the seed, Guarantee Early Weapons, how far the abilities spread, the shops, Entrance Rando (the doors), Boss Rando (the bosses), Instrument Randomization, Chip Randomizer (the Program Chips), Traps (trap items in some chests' places) and the spoiler log (written to the Saves folder's Seeds folder).
