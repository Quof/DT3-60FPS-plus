<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT3+ Check Tracker</title>
<link rel="stylesheet" href="tracker.css">
<script src="data.js"></script>
<script src="tracker.js"></script>
</head>
<body class="checks">
<header>
  <h1>DT3+ Check Tracker</h1>
  <div id="status">Waiting for the game...</div>
  <div class="controls">
    <label><input type="checkbox" id="hideTaken"> Hide taken</label>
    <label><input type="checkbox" id="follow"> Follow the player</label>
    <label id="entLabel" title="With Entrance Rando: in logic only what you can get to without a door you haven't been through; hover a room you've been to for the way there; each room shows how many doors you haven't been through you can get to (unexplored): while nothing's in logic, they're the way on; the room you're in also shows how many of its doors you can get to from where you came in (from here)"><input type="checkbox" id="entTrack"> Entrance Tracker</label>
  </div>
  <div class="legend">
    <span class="box out"></span>Out of logic <span class="box in"></span>In logic <span class="box taken">&#10003;</span>Taken
  </div>
</header>
<nav id="tabs"></nav>
<section id="here"></section>
<main id="panel"></main>
<script>
// The Check Tracker: every check by area (tabs) and screen, red out of logic, green in logic (what the player's items
// reach, with the seed's doors and bosses), blue once taken. The screen the player is in has its own space at the top,
// under the header as the page scrolls ("No Checks" in a room without any); the tab's other screens are below it. The
// game writes state.js; this reads it every second.
// The Entrance Tracker (off at first; only in a game with Entrance Rando): green only what the logic gets to from the
// start without going through a shuffled door the player hasn't been through (DT3.reach's known); a room the player has
// been to has the way there from Central City - North in its name's tooltip; each screen, and each room without checks
// that has some, with how many doors not been through yet can be got to there (unexplored: while the logic has the
// game won, there's always a check in logic or one of these), from anywhere the logic gets to; and the screen the
// player is in, with how many of their room's doors not been through yet they can get to from where they came in
// (from here: that room's own ways, from the way in they came in by, in the water level and switches they came in with)
(function () {
  "use strict";
  var D = window.DT3_DATA;
  var tabsEl = document.getElementById("tabs"), panel = document.getElementById("panel");
  var hereBox = document.getElementById("here"), headerEl = document.querySelector("header");
  var statusEl = document.getElementById("status");
  var hideTaken = document.getElementById("hideTaken"), follow = document.getElementById("follow");
  var entTrack = document.getElementById("entTrack"), entLabel = document.getElementById("entLabel");
  if (!D || !window.DT3) {
    panel.innerHTML = '<div class="empty">data.js isn\'t next to this page: the tracker folder comes with the mod ' +
      '(Mods\\Randomizer\\tracker).</div>';
    return;
  }
  function load(k, d) {
    try { var v = localStorage.getItem("dt3track." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  }
  function save(k, v) {
    try { localStorage.setItem("dt3track." + k, JSON.stringify(v)); } catch (e) { /* (not kept) */ }
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }
  var sel = Math.max(0, Math.min(load("tab", 0), D.tabs.length - 1));
  var state = null, status = null, cache = {}, lastRoom = null, scrollHere = false, unex = null, near = null;
  var hints = {}; // (the vending machines' hints, the state's: {location: what the hint named})
  hideTaken.checked = load("hideTaken", false);
  follow.checked = load("follow", true);
  entTrack.checked = load("entTrack", false);
  hideTaken.onchange = function () { save("hideTaken", hideTaken.checked); render(); };
  entTrack.onchange = function () { save("entTrack", entTrack.checked); update(state); };
  // (the Entrance Tracker at work: on, in a game with Entrance Rando)
  function entOn() { return entTrack.checked && !!state && state.er > 0; }
  follow.onchange = function () {
    save("follow", follow.checked);
    if (follow.checked && state && D.roomTab[state.room] !== undefined) { sel = D.roomTab[state.room]; scrollHere = true; }
    render();
  };
  // (the space for where the player is stays under the header, whatever its height: it wraps in a narrow window)
  function pin() { hereBox.style.top = headerEl.offsetHeight + "px"; }
  window.addEventListener("resize", pin);

  function showStatus() {
    statusEl.innerHTML = "";
    if (!state) {
      statusEl.textContent = "Waiting for the game: start or load a Randomizer game (it writes tracker\\state.js).";
      return;
    }
    var n = status.length, taken = 0, inl = 0, i;
    for (i = 0; i < n; i++) { if (status[i] === DT3.TAKEN) { taken++; } else if (status[i] === DT3.IN_LOGIC) { inl++; } }
    var parts = ["Seed <b>" + String(state.seed).replace(/[^0-9.\-]/g, "") + "</b>"].concat(DT3.modes(state));
    parts.push("Taken <b>" + taken + "</b> / " + n);
    parts.push("In logic <b>" + inl + "</b>" + (entOn() ? " (from the entrances you've been to)" : ""));
    if (entTrack.checked && !entOn()) { parts.push("Entrance Tracker: only with Entrance Rando"); }
    if (state.won) { parts.push("<b>Won!</b>"); }
    statusEl.innerHTML = parts.join(" &middot; ");
    var bad = DT3.mismatchShown(D, state, showStatus);
    if (bad) { var w = el("div", "warn", bad); statusEl.appendChild(w); }
  }

  function render() {
    var here = state ? D.roomScreen[state.room] : null;
    tabsEl.innerHTML = "";
    D.tabs.forEach(function (t, ti) {
      var n = 0, taken = 0, inl = 0;
      t.screens.forEach(function (s) {
        s.checks.forEach(function (i) {
          n++;
          if (status[i] === DT3.TAKEN) { taken++; } else if (status[i] === DT3.IN_LOGIC) { inl++; }
        });
      });
      var b = el("button", (ti === sel ? "sel" : "") + (here && here[0] === ti ? " here" : ""));
      b.appendChild(el("span", "long", t.name));
      b.appendChild(el("span", "short", t.name.replace(/^Access Gate (\d+):.*$/, "Gate $1")
        .replace(" & Neo Grime", "").replace("Nightmare Gates", "Nightmare").replace("CHAOS Warship", "Warship")));
      if (inl) { b.appendChild(el("span", "n in", String(inl))); }
      b.appendChild(el("span", taken === n ? "n done" : "n", taken + "/" + n));
      b.title = t.name + ": " + inl + " in logic, " + taken + " of " + n + " taken";
      b.onclick = function () { sel = ti; save("tab", sel); render(); };
      tabsEl.appendChild(b);
    });
    // where the player is: its screen's card (all its checks, taken ones too), whichever tab is showing; "No Checks" in
    // the middle of the space in a room without any, with the room's name over it
    hereBox.innerHTML = "";
    if (!state) {
      hereBox.appendChild(el("div", "none", "Waiting for the game"));
    } else if (here) {
      hereBox.appendChild(card(D.tabs[here[0]].screens[here[1]], true, false));
    } else {
      var where = el("div", "where"), hereName = (D.roomName && D.roomName[state.room]) || "", hereWay = wayHere([state.room]);
      if (hereName) { where.appendChild(el("span", "", hereName)); }
      where.appendChild(el("span", "tag", "you are here"));
      if (unex && unex[state.room]) { where.appendChild(unexTag([state.room])); }
      if (near) { where.appendChild(nearTag()); }
      if (hereWay) { where.title = (hereName ? hereName + "\n" : "") + hereWay; }
      hereBox.appendChild(where);
      hereBox.appendChild(el("div", "none", "No Checks"));
    }
    pin();
    // the tab's screens (but the player's own, at the top)
    panel.innerHTML = "";
    var tab = D.tabs[sel], hidden = 0, skipped = 0;
    tab.screens.forEach(function (s, si) {
      if (here && here[0] === sel && here[1] === si) { skipped++; return; }
      var n = s.checks.length, taken = 0;
      s.checks.forEach(function (i) { if (status[i] === DT3.TAKEN) { taken++; } });
      if (hideTaken.checked && taken === n && !unexOf(s.rooms)) { hidden++; return; }
      panel.appendChild(card(s, false, hideTaken.checked));
    });
    // (the Entrance Tracker: the tab's rooms without checks whose visited ways in get to doors not been through yet,
    // but the player's own room, at the top)
    if (unex) {
      var inScreens = {};
      tab.screens.forEach(function (s) { s.rooms.forEach(function (r) { inScreens[r] = true; }); });
      Object.keys(unex).sort(function (a, b) {
        var na = (D.roomName && D.roomName[a]) || a, nb = (D.roomName && D.roomName[b]) || b;
        return na < nb ? -1 : na > nb ? 1 : 0;
      }).forEach(function (r) {
        if (inScreens[r] || D.roomTab[r] !== sel || (state && r === state.room)) { return; }
        var c = el("section", "screen rooms"), h = el("h2"), rName = (D.roomName && D.roomName[r]) || r, rWay = wayHere([r]);
        h.appendChild(el("span", "", rName));
        h.appendChild(unexTag([r]));
        if (rWay) { h.title = rName + "\n" + rWay; }
        c.appendChild(h);
        panel.appendChild(c);
      });
    }
    if (!panel.children.length) {
      panel.appendChild(el("div", "empty", hidden ? "Everything else here is taken." : "Nothing else in this tab."));
    }
    if (scrollHere) { window.scrollTo(0, 0); }
    scrollHere = false;
    showStatus();
  }

  // (the Entrance Tracker: how many doors not been through yet can be got to in some rooms, and its tag)
  function unexOf(rooms) {
    var n = 0;
    if (unex) { rooms.forEach(function (r) { n += unex[r] || 0; }); }
    return n;
  }
  function unexTag(rooms) {
    var n = unexOf(rooms), t = el("span", "unex", n + " unexplored");
    t.title = n + (n === 1 ? " door" : " doors") + " you haven't been through yet, which you can get to here with what " +
      "you have";
    return t;
  }
  // (and in the room the player is in, the ones of its doors they can get to from where they came in: near, the cache's
  // H, only this room's own ways, not round through other rooms)
  function nearTag() {
    var n = near.size, t = el("span", "near", n + " from here");
    t.title = n + (n === 1 ? " door" : " doors") + " of this room you haven't been through yet that you can get to from " +
      "where you came in, with what you have (this room's own ways, not round through other rooms)";
    return t;
  }
  // (the Entrance Tracker: the way into some rooms (a screen's) the player has been to, from Central City - North, a
  // room a line with "->" between, the room it's from not listed; "" for rooms not been to. One the doors they've been
  // through don't lead to with what they have is out of logic: said so, with the way the doors they've been through
  // go there whatever each room takes, cache.K's, if they go there)
  function wayHere(rooms) {
    if (!unex) { return ""; }
    var p = DT3.pathToRooms(D, cache.R, rooms);
    if (p && p.fromStart) { return p.names.length === 1 ? "Where you start." : steps(p.names); }
    if (!been(rooms)) { return ""; }
    var k = cache.K ? DT3.pathToRooms(D, cache.K, rooms) : null;
    return "You've been here, but it's out of logic and may be difficult to make it back." +
      (k && k.names.length > 1 ? "\n" + steps(k.names) : "");
  }
  function steps(names) { return "Way here from " + names[0] + ":\n" + names.slice(1).join("\n->\n"); }
  // (whether the player has come into any of the rooms by a way in: the state's ervisit, a character a way in)
  var roomEntries = null;
  function been(rooms) {
    var L = D.logic, v = (state && state.ervisit) || "";
    if (!roomEntries) {
      roomEntries = {};
      L.entryRoom.forEach(function (ri, e) { (roomEntries[L.rooms[ri]] = roomEntries[L.rooms[ri]] || []).push(e); });
    }
    return rooms.some(function (r) { return (roomEntries[r] || []).some(function (e) { return v.charAt(e) === "1"; }); });
  }

  // a screen's card: its name, how many of its checks are taken, and each check (isHere: the player's, marked so;
  // hide: taken checks left out)
  function card(s, isHere, hide) {
    var n = s.checks.length, taken = 0;
    s.checks.forEach(function (i) { if (status[i] === DT3.TAKEN) { taken++; } });
    var c = el("section", "screen" + (taken === n ? " done" : "") + (isHere ? " here" : ""));
    var h = el("h2"), way = wayHere(s.rooms);
    h.appendChild(el("span", "", s.name));
    if (isHere) { h.appendChild(el("span", "tag", "you are here")); }
    if (unexOf(s.rooms)) { h.appendChild(unexTag(s.rooms)); }
    if (isHere && near) { h.appendChild(nearTag()); }
    h.appendChild(el("span", "count", taken + "/" + n));
    if (way) { h.title = s.name + "\n" + way; }
    c.appendChild(h);
    var ul = el("ul");
    s.checks.forEach(function (i) {
      var st = status[i];
      if (hide && st === DT3.TAKEN) { return; }
      var li = el("li", st === DT3.TAKEN ? "taken" : "");
      li.appendChild(el("span", "box " + (st === DT3.TAKEN ? "taken" : st === DT3.IN_LOGIC ? "in" : "out"),
        st === DT3.TAKEN ? "✓" : ""));
      li.appendChild(el("span", "name", D.locs[i].n));
      li.title = D.locs[i].id + " (" + D.locs[i].room + ")";
      // (a check the logic leaves out: why, beside it, till it's taken)
      if (D.locs[i].why && st !== DT3.TAKEN) {
        li.appendChild(el("span", "why", D.locs[i].why));
        li.title += "\nOut of logic: " + D.locs[i].why;
      }
      // (a vending machine's hint about it, not taken yet: what the hint named)
      if (hints[i] !== undefined && st !== DT3.TAKEN) {
        var hint = el("span", "hint", hints[i]);
        hint.title = "A vending machine's hint: " + hints[i] + " is here";
        li.appendChild(hint);
      }
      ul.appendChild(li);
    });
    c.appendChild(ul);
    return c;
  }

  function update(S) {
    state = S;
    hints = {};
    ((S && S.hints) || []).forEach(function (h) { hints[h[0]] = String(h[1]); });
    status = DT3.evaluate(D, S || {}, cache, entTrack.checked);
    unex = entOn() ? DT3.unexploredByRoom(D, cache.R) : null;
    near = entOn() && cache.H ? cache.H : null;
    entLabel.className = state && !(state.er > 0) ? "off" : "";
    if (S && S.room !== lastRoom) {
      lastRoom = S.room;
      if (follow.checked && D.roomTab[S.room] !== undefined) { sel = D.roomTab[S.room]; scrollHere = true; }
    }
    render();
  }
  update(null);
  DT3.watch(update);
})();
</script>
</body>
</html>
